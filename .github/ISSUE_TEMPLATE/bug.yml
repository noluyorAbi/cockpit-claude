name: Bug
description: Something renders wrong, or does not render at all
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If your statusline is **blank**, that is cockpit failing safely rather
        than printing a stack trace. Run it by hand to see the real error:

        ```bash
        echo '{"model":{"display_name":"Test"}}' | node ~/.claude/cockpit/statusline.js
        ```
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output of the command above
      render: shell
  - type: textarea
    id: config
    attributes:
      label: Your cockpit.config.json
      description: Redact anything you would rather not share.
      render: json
  - type: input
    id: env
    attributes:
      label: OS, terminal, and node version
      placeholder: macOS 15.3, iTerm2, node 22.11
    validations:
      required: true
